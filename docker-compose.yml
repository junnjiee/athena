# Full local Athena: terrain service, planning engine, web app, and Postgres.
#
#   cp .env.docker.example .env && docker compose up --build
#
# Web app        http://localhost:5173
# Terrain API    http://localhost:8787
# Engine API     http://localhost:8000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U athena -d athena']
      interval: 3s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: ./engine
    environment:
      TERRAIN_SERVICE_URL: http://server:8787
      # The model that reasons about enemy intent, as provider:name. Only the
      # courses-of-action pass needs it; routes and block forces are
      # deterministic and run without it.
      ATHENA_MODEL: ${ATHENA_MODEL:-openai:gpt-5.6-sol}
      # One key, whichever provider is named above. No vendor is named here or
      # anywhere else, so changing provider is a change of .env alone.
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
    env_file:
      - path: .env
        required: false
    ports:
      - '8000:8000'
    volumes:
      - ./engine/athena:/app/athena:ro
    depends_on:
      - server

  server:
    build:
      context: ./server
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://athena:athena@postgres:5432/athena
      ENGINE_URL: http://engine:8000
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      # Unset means "any localhost port", which is what the browser uses here.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '8787:8787'
    # Source is mounted over the image's copy so an edit on the host is picked
    # up here. Without this the container serves whatever was baked in at build
    # time, which looks exactly like a change silently not working.
    # node_modules is deliberately not mounted: it belongs to the image.
    volumes:
      - ./server/src:/app/src:ro
      - ./server/drizzle:/app/drizzle:ro
    command: >
      sh -c "node_modules/.bin/drizzle-kit migrate &&
             exec node_modules/.bin/tsx watch src/index.ts"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY: http://server:8787
      VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
    ports:
      - '5173:5173'
    # Same reasoning as the server: without these mounts Vite serves the source
    # as of `docker compose build`, and HMR has nothing to watch.
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/public:/app/public:ro
    depends_on:
      - server

volumes:
  postgres-data:
